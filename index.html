<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RP Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --asphalt: #121722;
    --s1: #1A2130;
    --s2: #232C3E;
    --s3: #2E3950;
    --line: rgba(160, 175, 205, .13);
    --text: #E8ECF3;
    --muted: #8A94A7;
    --plate: #F4F5F0;
    --ink: #0E1014;
    --ua: #1F4FBF;
    --mark: #F2C230;
    --green: #3FB97A;
    --red: #E5484D;
    --blue: #5B8CFF;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.34, 1.45, .5, 1);
    --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --f-num: 'Barlow Condensed', 'Golos Text', system-ui, sans-serif;
    --tabbar: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--asphalt); }
body {
    margin: 0; min-height: 100vh;
    font-family: var(--f-body); font-size: 15px; line-height: 1.45;
    color: var(--text); background: var(--asphalt);
    padding-bottom: calc(var(--tabbar) + var(--safe-b) + 16px);
    -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea {
    font: inherit; color: var(--text); width: 100%;
    background: var(--s1); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; outline: none; transition: border-color .2s, background .2s;
}
input::placeholder, textarea::placeholder { color: #5E687C; }
input:focus, textarea:focus { border-color: var(--mark); background: var(--s2); }
textarea { resize: none; min-height: 96px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
img { display: block; }

/* ---------- іконки ---------- */
.i { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i--s { width: 16px; height: 16px; }
.i--l { width: 24px; height: 24px; }
.i--fill { fill: currentColor; stroke: none; }

/* ---------- номерний знак (ціна) ---------- */
.plate {
    display: inline-flex; align-items: stretch; flex-shrink: 0;
    background: var(--plate); color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 5px;
    box-shadow: 0 0 0 1.5px var(--plate), 0 2px 8px rgba(0, 0, 0, .35);
    font-family: var(--f-num); font-weight: 700; line-height: 1; overflow: hidden;
    margin: 1.5px;
}
.plate > i {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--ua); color: #fff; font-style: normal; font-size: 7px; font-weight: 600;
    padding: 0 3px; letter-spacing: .02em;
}
.plate > i::before { content: ''; width: 9px; height: 6px; background: linear-gradient(#3B7BFF 50%, #FFD500 50%); border-radius: 1px; }
.plate > b { padding: 4px 7px 3px; font-size: 18px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.plate--vip { background: var(--mark); box-shadow: 0 0 0 1.5px var(--mark), 0 2px 10px rgba(242, 194, 48, .3); }
.plate--l > b { font-size: 30px; padding: 6px 12px 5px; }
.plate--l > i { font-size: 9px; padding: 0 5px; }
.plate--l > i::before { width: 13px; height: 9px; }
.plate--s > b { font-size: 15px; padding: 3px 5px 2px; }
.plate--s > i { font-size: 6px; padding: 0 2px; }
.plate--s > i::before { width: 7px; height: 5px; }

/* ---------- шапка ---------- */
.topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 16px;
    background: rgba(18, 23, 34, .82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .25s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .back { display: none; width: 36px; height: 36px; margin-left: -8px; border-radius: 10px; align-items: center; justify-content: center; }
.topbar .back.show { display: flex; }
.topbar-title { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { display: flex; align-items: center; gap: 7px; font-family: var(--f-num); font-size: 22px; font-weight: 600; letter-spacing: .01em; }
.logo .plate > b { font-size: 16px; padding: 3px 5px 2px; }
.bal-chip {
    display: flex; align-items: center; gap: 6px; padding: 6px 11px 6px 9px;
    background: var(--s1); border: 1px solid var(--line); border-radius: 20px;
    font-family: var(--f-num); font-size: 17px; font-weight: 600; color: var(--text);
    transition: transform .15s var(--ease);
}
.bal-chip .i { color: var(--mark); width: 17px; height: 17px; }
.bal-chip:active { transform: scale(.94); }
.bal-chip.bump { animation: bump .5s var(--spring); }
@keyframes bump { 40% { transform: scale(1.12); } }

main { padding: 12px 16px 0; overflow-x: clip; }

/* ---------- переходи між сторінками ---------- */
.page { animation-duration: .32s; animation-timing-function: var(--ease); animation-fill-mode: backwards; }
.enter-fwd { animation-name: inFwd; }
.enter-back { animation-name: inBack; }
.enter-fade { animation-name: inFade; animation-duration: .22s; }
@keyframes inFwd { from { opacity: 0; transform: translateX(28px); } }
@keyframes inBack { from { opacity: 0; transform: translateX(-28px); } }
@keyframes inFade { from { opacity: 0; } }

/* ---------- кнопки ---------- */
.btn {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px; padding: 0 18px; border-radius: 14px;
    font-weight: 600; font-size: 15px; overflow: hidden;
    transition: transform .15s var(--ease), opacity .2s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn--main { background: var(--mark); color: var(--ink); }
.btn--main::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-120%);
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%);
}
.btn--main.shine::after { animation: shine 1.1s .4s var(--ease); }
@keyframes shine { to { transform: translateX(120%); } }
.btn--ghost { background: var(--s2); color: var(--text); }
.btn--green { background: var(--green); color: #06170E; }
.btn--danger { background: rgba(229, 72, 77, .12); color: #FF7A7E; }
.btn--s { min-height: 38px; padding: 0 13px; border-radius: 11px; font-size: 14px; width: auto; }
.btn.loading { color: transparent !important; }
.btn.loading::before {
    content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    border: 2.5px solid currentColor; border-color: var(--ink) transparent var(--ink) transparent;
    animation: spin .7s linear infinite;
}
.btn--ghost.loading::before, .btn--danger.loading::before { border-color: var(--text) transparent var(--text) transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.row-btns { display: flex; gap: 10px; }
.row-btns > * { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--s1); border: 1px solid var(--line); transition: transform .15s var(--ease); }
.icon-btn:active { transform: scale(.92); }
.link { color: var(--mark); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }

/* ---------- загальне ---------- */
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; font-size: 18px; font-weight: 700; }
.sec-title small { font-size: 13px; font-weight: 500; color: var(--muted); }
.panel { background: var(--s1); border-radius: 18px; padding: 16px; }
.panel + .panel { margin-top: 12px; }
.empty { text-align: center; padding: 44px 20px; color: var(--muted); }
.empty .i { width: 40px; height: 40px; stroke-width: 1.4; color: var(--s3); margin: 0 auto 12px; display: block; }
.empty p { margin-bottom: 16px; max-width: 30ch; margin-inline: auto; }
.stagger > * { animation: rise .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.fade { opacity: 0; transition: opacity .45s var(--ease); }
.fade.ok { opacity: 1; }

/* скелетони */
.sk { background: linear-gradient(90deg, var(--s1) 0%, var(--s2) 50%, var(--s1) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: 10px; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- головна ---------- */
.safe {
    display: flex; gap: 14px; align-items: center;
    padding: 16px; border-radius: 20px; background: var(--s1); position: relative; overflow: hidden;
}
.safe::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 3px; background: repeating-linear-gradient(90deg, var(--mark) 0 16px, transparent 16px 30px); opacity: .55; }
.safe svg.shield { width: 58px; height: 58px; flex-shrink: 0; }
.shield path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.shield .s-body { stroke: var(--mark); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 0; }
.shield .s-check { stroke: var(--text); stroke-width: 3.4; stroke-dasharray: 1; stroke-dashoffset: 0; }
.shield .s-fill { fill: rgba(242, 194, 48, .1); stroke: none; }
.shield.draw .s-body { animation: draw 1.1s .15s var(--ease) both; }
.shield.draw .s-check { animation: draw .5s 1.1s var(--ease) both; }
.shield.draw .s-fill { animation: inFade .6s 1.2s both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.safe h2 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.safe p { font-size: 13.5px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }

.projects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.proj {
    text-align: left; display: flex; flex-direction: column; gap: 10px;
    background: var(--s1); border-radius: 20px; padding: 12px; border: 1px solid var(--line);
    transition: transform .2s var(--ease), border-color .2s;
}
.proj:active { transform: scale(.96); border-color: var(--mark); }
.proj-logo { aspect-ratio: 1.35; border-radius: 14px; background: radial-gradient(circle at 50% 40%, var(--s3), var(--asphalt) 75%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.proj-logo img { width: 78%; height: 78%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .5)); }
.proj-logo .fallback { font-family: var(--f-num); font-size: 34px; font-weight: 700; color: var(--muted); }
.proj b { font-size: 15px; font-weight: 600; padding: 0 4px; }
.proj span { font-size: 12.5px; color: var(--muted); padding: 0 4px; margin-top: -8px; }

/* ---------- стрічка ---------- */
.filterbar { position: sticky; top: 56px; z-index: 20; background: var(--asphalt); margin: -12px -16px 0; padding: 10px 16px 0; }
.search { position: relative; display: flex; gap: 8px; }
.search > .i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 42px; height: 44px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 8px 13px 8px 11px; border-radius: 20px; font-size: 14px; font-weight: 500;
    background: var(--s1); color: var(--muted); border: 1px solid var(--line);
    transition: background .22s var(--ease), color .22s, transform .15s;
}
.chip .i { width: 17px; height: 17px; }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--plate); color: var(--ink); border-color: var(--plate); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lcard {
    position: relative; display: flex; flex-direction: column; background: var(--s1); border-radius: 16px; overflow: hidden;
    border: 1.5px solid transparent; text-align: left; transition: transform .18s var(--ease);
}
.lcard:active { transform: scale(.97); }
.lcard.vip { border-color: var(--mark); }
.thumb { position: relative; aspect-ratio: 4 / 3; background: var(--s2); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--s3);
      background: repeating-linear-gradient(135deg, var(--s2) 0 10px, #26304380 10px 20px); }
.ph .i { width: 38%; height: 38%; stroke-width: 1.3; color: #46526C; }
.tags { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 7px; border-radius: 7px; font-size: 11.5px; font-weight: 700; }
.tag .i { width: 13px; height: 13px; stroke-width: 2.2; }
.tag--vip { background: var(--mark); color: var(--ink); }
.tag--top { background: var(--blue); color: #fff; }
.lbody { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.lbody h3 { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.seller-mini { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.seller-mini span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seller-mini .rate { color: var(--mark); display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
.lbody .plate { align-self: flex-start; margin-top: auto; }

/* ---------- аватари ---------- */
.ava { position: relative; flex-shrink: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
.ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ava--xs { width: 20px; height: 20px; font-size: 10px; }
.ava--s { width: 34px; height: 34px; font-size: 14px; }
.ava--m { width: 46px; height: 46px; font-size: 18px; }
.ava--xl { width: 88px; height: 88px; font-size: 34px; border: 4px solid var(--asphalt); }

/* ---------- сторінка оголошення ---------- */
.hero-img { margin: -12px -16px 0; aspect-ratio: 4 / 3; max-height: 340px; width: calc(100% + 32px); background: var(--s1); overflow: hidden; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; }
.l-head { padding: 18px 0 4px; }
.l-head .tags { position: static; margin-bottom: 10px; }
.l-head h1 { font-size: 22px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 16px; overflow: hidden; margin: 18px 0 12px; }
.facts div { background: var(--s1); padding: 11px 14px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; font-size: 14.5px; }
.desc { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.seller-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; transition: transform .15s var(--ease); }
.seller-card:active { transform: scale(.98); }
.seller-card .grow { flex: 1; min-width: 0; }
.seller-card b { display: block; font-size: 16px; }
.trust { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 8px 3px 6px; border-radius: 8px; margin-top: 4px; }
.trust .i { width: 14px; height: 14px; stroke-width: 2.2; }
.trust--ok { background: rgba(63, 185, 122, .13); color: var(--green); }
.trust--new { background: var(--s2); color: var(--muted); }
.stars { display: inline-flex; gap: 1px; color: var(--mark); vertical-align: -2px; }
.stars .i { width: 14px; height: 14px; }
.stars .off { color: var(--s3); }
.buybar {
    position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe-b)); z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: rgba(26, 33, 48, .92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); animation: barUp .4s var(--ease) both;
}
@keyframes barUp { from { transform: translateY(100%); } }
.buybar .btn { flex: 1; }
.has-buybar { padding-bottom: 84px; }

/* ---------- відгуки ---------- */
.review { display: flex; gap: 11px; padding: 14px 0; border-top: 1px solid var(--line); }
.review:first-child { border-top: 0; padding-top: 2px; }
.review .body { flex: 1; min-width: 0; }
.review .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.review .head b { font-size: 14.5px; }
.review p { margin-top: 5px; font-size: 14.5px; line-height: 1.5; word-break: break-word; }
.review .deal { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 5px; }
.rsum { display: flex; gap: 20px; align-items: center; }
.rsum .avg { text-align: center; }
.rsum .avg b { display: block; font-family: var(--f-num); font-size: 48px; font-weight: 700; line-height: 1; }
.rsum .bars { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.bar span:first-child { width: 8px; font-family: var(--f-num); font-size: 14px; }
.bar .track { flex: 1; height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--mark); border-radius: 3px; width: 0; transition: width .8s var(--ease); }
.bar span:last-child { width: 22px; text-align: right; }

/* ---------- форма ---------- */
.field { display: block; margin-bottom: 16px; }
.field > span { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
.pick-proj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.pick-proj button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 14px; background: var(--s1); border: 1.5px solid var(--line); font-size: 11.5px; line-height: 1.2; text-align: center; color: var(--muted); transition: border-color .2s, color .2s, transform .15s; }
.pick-proj button:active { transform: scale(.95); }
.pick-proj button.on { border-color: var(--mark); color: var(--text); }
.pick-proj img { width: 38px; height: 38px; object-fit: contain; }
.payout { background: var(--s1); border-radius: 14px; padding: 12px 14px; margin: -4px 0 16px; font-size: 14px; }
.payout div { display: flex; justify-content: space-between; padding: 3px 0; }
.payout div:last-child { border-top: 1px dashed var(--line); margin-top: 5px; padding-top: 8px; font-weight: 600; }
.payout div:last-child b { color: var(--green); }
.drop { position: relative; height: 170px; border: 1.5px dashed var(--s3); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); overflow: hidden; transition: border-color .2s; width: 100%; }
.drop:active { border-color: var(--mark); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }

/* ---------- сегменти ---------- */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--s1); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
.seg::before { content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n, 2)); background: var(--s3); border-radius: 10px; transform: translateX(calc(var(--v, 0) * 100%)); transition: transform .35s var(--ease); }
.seg button { position: relative; z-index: 1; padding: 9px 4px; font-size: 14px; font-weight: 600; color: var(--muted); transition: color .25s; }
.seg button.on { color: var(--text); }

/* ---------- угоди ---------- */
.drow { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px; background: var(--s1); border-radius: 16px; margin-bottom: 10px; transition: transform .15s var(--ease); }
.drow:active { transform: scale(.98); }
.drow .grow { flex: 1; min-width: 0; }
.drow b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drow .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.drow .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.sico { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sico .i { width: 19px; height: 19px; }
.c-blue { background: rgba(91, 140, 255, .14); color: var(--blue); }
.c-yellow { background: rgba(242, 194, 48, .14); color: var(--mark); }
.c-red { background: rgba(229, 72, 77, .14); color: #FF7A7E; }
.c-green { background: rgba(63, 185, 122, .14); color: var(--green); }
.c-grey { background: var(--s2); color: var(--muted); }
.timer { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mark); }
.timer .i { width: 13px; height: 13px; }

.deal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.deal-top h1 { font-size: 18px; font-weight: 700; line-height: 1.3; }
.status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px 5px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status .i { width: 15px; height: 15px; }
.money { margin-top: 14px; font-size: 14px; }
.money div { display: flex; justify-content: space-between; padding: 4px 0; }
.track-steps { position: relative; display: flex; justify-content: space-between; margin: 20px 4px 2px; }
.track-steps .line { position: absolute; left: 14px; right: 14px; top: 13px; height: 3px; background: var(--s3); border-radius: 2px; }
.track-steps .line i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 2px; width: 0; transition: width .9s .15s var(--ease); }
.tstep { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); width: 33%; }
.track-steps .line + .tstep { align-items: flex-start; }
.tstep:last-child { align-items: flex-end; }
.tstep .dot { width: 29px; height: 29px; border-radius: 50%; background: var(--s2); border: 2px solid var(--s3); display: flex; align-items: center; justify-content: center; transition: background .3s, border-color .3s; }
.tstep .dot .i { width: 15px; height: 15px; stroke-width: 2.6; opacity: 0; }
.tstep.done { color: var(--text); }
.tstep.done .dot { background: var(--green); border-color: var(--green); color: #06170E; animation: pop .45s var(--spring) both; animation-delay: calc(var(--i) * 260ms + .2s); }
.tstep.done .dot .i { opacity: 1; }
@keyframes pop { 0% { transform: scale(.6); } }
.hint { display: flex; gap: 10px; padding: 13px 14px; border-radius: 14px; background: var(--s1); border-left: 3px solid var(--mark); margin: 12px 0; font-size: 14px; line-height: 1.5; }
.hint .i { color: var(--mark); margin-top: 1px; }
.hint--red { border-left-color: var(--red); }
.hint--red .i { color: var(--red); }
.hint--green { border-left-color: var(--green); }
.hint--green .i { color: var(--green); }
.actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

.chat { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px 2px 10px; }
.msg { max-width: 82%; padding: 9px 12px 7px; border-radius: 16px; font-size: 14.5px; line-height: 1.42; white-space: pre-wrap; word-break: break-word; animation: msgIn .28s var(--ease) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.msg time { display: block; font-size: 10.5px; opacity: .55; margin-top: 3px; text-align: right; }
.msg.me { align-self: flex-end; background: var(--mark); color: var(--ink); border-bottom-right-radius: 5px; }
.msg.them { align-self: flex-start; background: var(--s2); border-bottom-left-radius: 5px; }
.msg.sys { align-self: stretch; max-width: none; background: transparent; border: 1px dashed var(--s3); color: var(--muted); font-size: 13px; border-radius: 12px; }
.msg.adm { align-self: stretch; max-width: none; background: rgba(91, 140, 255, .1); border: 1px solid rgba(91, 140, 255, .3); }
.msg.adm strong { color: var(--blue); display: block; font-size: 12.5px; margin-bottom: 2px; }
.composer { display: flex; gap: 8px; margin-top: 4px; }
.composer input { flex: 1; height: 46px; border-radius: 23px; padding-left: 18px; }
.composer .send { width: 46px; height: 46px; border-radius: 50%; background: var(--mark); color: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s var(--spring); }
.composer .send:active { transform: scale(.88); }
.rate-pick { display: flex; gap: 6px; margin: 10px 0 12px; }
.rate-pick button .i { width: 34px; height: 34px; color: var(--s3); transition: color .2s, transform .25s var(--spring); }
.rate-pick button.on .i { color: var(--mark); transform: scale(1.08); }

/* ---------- профіль ---------- */
.pf { margin: -12px -16px 0; }
.pf-road { height: 92px; background: linear-gradient(180deg, #0D111A, var(--asphalt)); position: relative; overflow: hidden; }
.pf-road::before { content: ''; position: absolute; left: -60px; right: -60px; top: 44px; height: 4px; background: repeating-linear-gradient(90deg, var(--mark) 0 26px, transparent 26px 50px); opacity: .7; animation: drive 1.4s var(--ease) both; }
@keyframes drive { from { transform: translateX(-50px); opacity: 0; } }
.pf-main { padding: 0 16px; margin-top: -46px; position: relative; }
.pf-main h1 { font-size: 24px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
.pf-since { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pf-bio { margin-top: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.pf-bio.empty-bio { color: var(--muted); font-style: italic; }
.pf-actions { position: absolute; right: 16px; top: 52px; display: flex; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; background: var(--s1); border-radius: 16px; }
.stats div { padding: 12px 8px; text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--f-num); font-size: 26px; font-weight: 700; line-height: 1.05; }
.stats b .i { color: var(--mark); width: 18px; height: 18px; }
.stats span { font-size: 12.5px; color: var(--muted); }

.wallet { margin-top: 16px; padding: 18px; border-radius: 20px; background: linear-gradient(160deg, #1D2638, #161C29); border: 1px solid var(--line); position: relative; overflow: hidden; }
.wallet .plate { position: absolute; right: 16px; top: 16px; transform: rotate(-4deg); }
.wallet label { font-size: 13px; color: var(--muted); }
.wallet .sum { font-family: var(--f-num); font-size: 44px; font-weight: 700; line-height: 1.05; margin: 2px 0 12px; font-variant-numeric: tabular-nums; }
.wallet .sub { display: flex; gap: 20px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.wallet .sub b { color: var(--text); font-weight: 600; display: block; font-family: var(--f-num); font-size: 18px; }
.mine { display: flex; gap: 12px; align-items: center; padding: 10px; background: var(--s1); border-radius: 16px; margin-bottom: 10px; }
.mine .thumbs { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--s2); }
.mine .thumbs img { width: 100%; height: 100%; object-fit: cover; }
.mine .grow { flex: 1; min-width: 0; text-align: left; }
.mine b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mine .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--s2); color: var(--muted); }
.pill .i { width: 12px; height: 12px; }
.pill--vip { background: rgba(242, 194, 48, .15); color: var(--mark); }
.pill--top { background: rgba(91, 140, 255, .15); color: var(--blue); }
.ledger { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.ledger:first-child { border-top: 0; padding-top: 0; }
.ledger .grow { flex: 1; min-width: 0; }
.ledger .amt { font-family: var(--f-num); font-size: 18px; font-weight: 600; }
.plus { color: var(--green); }
.minus { color: var(--text); }

/* ---------- нижня навігація ---------- */
.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(var(--tabbar) + var(--safe-b)); padding-bottom: var(--safe-b);
    background: rgba(18, 23, 34, .9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
}
.tabbar .ind { position: absolute; top: -1px; left: 0; width: 25%; height: 3px; display: flex; justify-content: center; transform: translateX(calc(var(--t, 0) * 100%)); transition: transform .42s var(--spring); }
.tabbar .ind::before { content: ''; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--mark); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); position: relative; transition: color .25s; }
.tab .i { width: 23px; height: 23px; transition: transform .3s var(--spring); }
.tab.on { color: var(--text); }
.tab.on .i { transform: translateY(-1px) scale(1.06); }
.tab:active .i { transform: scale(.86); }
.tab .plus-ico { width: 40px; height: 32px; border-radius: 11px; background: var(--mark); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.tab .plus-ico .i { stroke-width: 2.4; width: 21px; height: 21px; }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; display: none; align-items: center; justify-content: center; }
.tab .badge.show { display: flex; animation: pop .4s var(--spring); }

/* ---------- шторка ---------- */
.backdrop { position: fixed; inset: 0; z-index: 90; background: rgba(5, 8, 14, .6); opacity: 0; pointer-events: none; transition: opacity .3s; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.backdrop.on { opacity: 1; pointer-events: auto; }
.sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    max-height: 90vh; overflow-y: auto; background: var(--s1);
    border-radius: 24px 24px 0 0; padding: 10px 18px calc(20px + var(--safe-b));
    transform: translateY(105%); transition: transform .42s var(--ease); visibility: hidden;
}
.sheet.on { transform: none; visibility: visible; }
.sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--s3); margin: 0 auto 16px; }
.sheet h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.sheet .lead { color: var(--muted); font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
.sheet .cancel { margin-top: 10px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--s2); margin-bottom: 10px; }
.opt .grow { flex: 1; min-width: 0; }
.opt h4 { font-size: 15px; font-weight: 700; }
.opt p { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.opt .pays { display: flex; flex-direction: column; gap: 6px; }
.pay { min-width: 76px; height: 34px; padding: 0 10px; border-radius: 10px; font-family: var(--f-num); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; transition: transform .15s var(--ease); }
.pay:active { transform: scale(.94); }
.pay--uah { background: var(--plate); color: var(--ink); }
.pay--star { background: #2C3A5A; color: #FFD66B; }
.pay--star .i { width: 14px; height: 14px; }
.sum-box { background: var(--s2); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
.sum-box .line { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14.5px; }
.steps-list { list-style: none; padding: 0; margin: 0 0 16px; counter-reset: s; }
.steps-list li { counter-increment: s; display: flex; gap: 12px; padding: 7px 0; font-size: 14.5px; line-height: 1.45; }
.steps-list li::before { content: counter(s); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--s3); font-family: var(--f-num); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: -6px 0 16px; }
.presets button { height: 38px; border-radius: 10px; background: var(--s2); font-family: var(--f-num); font-size: 17px; font-weight: 600; transition: transform .15s, background .2s; }
.presets button:active { transform: scale(.94); background: var(--s3); }
.methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.methods button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: 14px; background: var(--s2); border: 1.5px solid transparent; font-size: 13.5px; font-weight: 600; color: var(--muted); transition: border-color .2s, color .2s; }
.methods button.on { border-color: var(--mark); color: var(--text); }
.sort-opt { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 4px; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.sort-opt .i { color: var(--mark); opacity: 0; transition: opacity .2s; }
.sort-opt.on .i { opacity: 1; }

/* ---------- тости ---------- */
.toasts { position: fixed; top: 10px; left: 12px; right: 12px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--plate); color: var(--ink); font-size: 14.5px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: toastIn .38s var(--spring) both; }
.toast .i { color: var(--green); }
.toast.err { background: #2A1518; color: #FFD5D6; border: 1px solid rgba(229, 72, 77, .5); }
.toast.err .i { color: var(--red); }
.toast.out { animation: toastOut .3s var(--ease) both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-14px); } }

.gate { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 24px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}

    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11.5" rx="3"/><path d="M12 4.5V8M9 13v1.5M15 13v1.5"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7.5 4.5v15M4.5 16.5l3 3 3-3M16.5 19.5v-15M13.5 7.5l3-3 3 3"/></symbol>
    <symbol id="i-tg" viewBox="0 0 24 24"><path d="m21 4.5-3 15.5-6.2-4.8-3 2.8.5-4.3 8.2-7.4-10.3 6.4L3 11.4z"/></symbol>
</svg>

<header class="topbar" id="topbar">
    <button class="back" id="backBtn" onclick="back()" aria-label="Назад"><svg class="i i--l"><use href="#i-back"/></svg></button>
    <div class="topbar-title" id="title"></div>
    <button class="bal-chip" id="balChip" onclick="setTab('profile')" style="display:none" aria-label="Баланс"><svg class="i"><use href="#i-wallet"/></svg><span id="balVal"></span></button>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar" style="--t:0">
    <span class="ind"></span>
    <button class="tab" data-tab="market" onclick="setTab('market')"><svg class="i"><use href="#i-store"/></svg>Ринок</button>
    <button class="tab" data-tab="deals" onclick="setTab('deals')"><svg class="i"><use href="#i-swap"/></svg>Угоди<span class="badge" id="dealsBadge"></span></button>
    <button class="tab" data-tab="sell" onclick="setTab('sell')"><span class="plus-ico"><svg class="i"><use href="#i-plus"/></svg></span>Продати</button>
    <button class="tab" data-tab="profile" onclick="setTab('profile')"><svg class="i"><use href="#i-user"/></svg>Профіль</button>
</nav>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>

<script>
// Адреса бекенду (тунель cloudflared). Після перезапуску тунелю — заміни тут.
const API_URL = 'https://kelly-contribution-outcomes-toronto.trycloudflare.com';

const tg = window.Telegram && window.Telegram.WebApp;
const $main = document.getElementById('main');
let CFG = null, ME = null, COUNTS = {}, renderSeq = 0, pollTimer = null, feed = null, shownBalance = null, homeAnimated = false;
const state = { tab: 'market', stack: [], project: null };
const TABS = ['market', 'deals', 'sell', 'profile'];
const ROOTS = { market: 'home', deals: 'deals', sell: 'sell', profile: 'me' };

const CAT_ICON = { currency: 'coins', account: 'idcard', property: 'house', boost: 'zap', other: 'box' };
const STATUS = {
    paid:      { t: 'Оплачено',   i: 'lock',  c: 'c-blue' },
    delivered: { t: 'Передано',   i: 'box',   c: 'c-yellow' },
    dispute:   { t: 'Спір',       i: 'scale', c: 'c-red' },
    completed: { t: 'Завершено',  i: 'check', c: 'c-green' },
    refunded:  { t: 'Повернено',  i: 'undo',  c: 'c-grey' },
};
const LEDGER = {
    topup: ['Поповнення', 'in'], deal_hold: ['Оплата угоди', 'lock'], deal_refund: ['Повернення з угоди', 'undo'],
    deal_payout: ['Продаж', 'coins'], withdraw: ['Виведення', 'out'], withdraw_back: ['Скасоване виведення', 'undo'],
    promo: ['Просування', 'rocket'], admin: ['Коригування адміністратором', 'shield'],
};
const AVA_COLORS = ['#3B5BA9', '#2F7D6B', '#8A4FBF', '#B5653A', '#3D7EA6', '#A8456B', '#5E7A2E', '#7A5C3B'];

// ================================================================ утиліти
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const num = k => ((k || 0) / 100).toLocaleString('uk-UA', { maximumFractionDigits: 2 });
const uah = k => num(k) + ' ₴';
const plate = (k, cls = '') => `<span class="plate ${cls}"><i>UA</i><b>${num(k)} ₴</b></span>`;
const media = p => p ? API_URL + p : null;
const haptic = (t = 'light') => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const hapticN = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
const W = { deal: ['угода', 'угоди', 'угод'], review: ['відгук', 'відгуки', 'відгуків'], listing: ['оголошення', 'оголошення', 'оголошень'] };
function when(ts) {
    const d = new Date(ts * 1000), now = new Date();
    const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
    const hm = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    if (days === 0) return 'сьогодні, ' + hm;
    if (days === 1) return 'вчора, ' + hm;
    return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }) + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
}
const hm = ts => new Date(ts * 1000).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
function left(ts) {
    const s = ts - Date.now() / 1000;
    if (s <= 0) return 'час минув';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h} год ${m} хв` : `${m} хв`;
}
function stars(r, cls = '') {
    let h = '';
    for (let i = 1; i <= 5; i++) h += ic('star', 'i--fill ' + (i <= Math.round(r) ? '' : 'off'));
    return `<span class="stars ${cls}">${h}</span>`;
}
function ava(u, size = 's') {
    const name = (u && u.name) || '?';
    const color = AVA_COLORS[Math.abs(u && u.id || 0) % AVA_COLORS.length];
    const img = u && u.photo ? `<img src="${esc(u.photo)}" alt="" class="fade" onload="this.classList.add('ok')" onerror="this.remove()">` : '';
    return `<span class="ava ava--${size}" style="background:${color}">${esc(name.trim().charAt(0).toUpperCase())}${img}</span>`;
}
function trust(u) {
    if (u.deals >= 10 && u.rating >= 4.5) return `<span class="trust trust--ok">${ic('shield')}Надійний продавець</span>`;
    if (!u.deals) return `<span class="trust trust--new">Новий на маркеті</span>`;
    return '';
}
const imgTag = (src, alt = '') => `<img src="${esc(src)}" alt="${esc(alt)}" class="fade" loading="lazy" onload="this.classList.add('ok')" onerror="this.parentNode.innerHTML='<div class=&quot;ph&quot;>${ic('image').replace(/"/g, '&quot;')}</div>'">`;
const phTag = cat => `<div class="ph">${ic(CAT_ICON[cat] || 'box')}</div>`;

async function api(path, body) {
    let res;
    try {
        res = await fetch(API_URL + path, {
            method: body ? 'POST' : 'GET',
            headers: { 'Authorization': 'tma ' + (tg ? tg.initData : ''), 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined,
        });
    } catch (e) { throw new Error('Немає зв\'язку з сервером. Перевір інтернет і спробуй ще раз.'); }
    let data;
    try { data = await res.json(); } catch (e) { throw new Error('Сервер не відповідає. Спробуй за хвилину.'); }
    if (!data.ok) throw new Error(data.error || 'Щось пішло не так');
    return data.data;
}

function toast(text, err) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.innerHTML = ic(err ? 'alert' : 'check') + `<span>${esc(text)}</span>`;
    box.appendChild(t);
    err ? hapticN('error') : hapticN('success');
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800);
}

function confirmBox(text) {
    return new Promise(resolve => {
        try { if (tg && tg.isVersionAtLeast('6.2')) return tg.showConfirm(text, ok => resolve(!!ok)); } catch (e) {}
        resolve(window.confirm(text));
    });
}

async function run(btn, fn) {
    if (btn) { if (btn.disabled) return; btn.disabled = true; btn.classList.add('loading'); }
    try { await fn(); } catch (e) { toast(e.message, true); }
    finally { if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove('loading'); } }
}

function feeFor(p) { return Math.min(p, Math.max(Math.round(p * CFG.commission_percent / 100), CFG.min_commission)); }
function parseMoney(s) { const v = parseFloat(String(s || '').replace(',', '.').replace(/\s/g, '')); return isFinite(v) && v > 0 ? Math.round(v * 100) : 0; }

function countUp(el, from, to, ms = 700) {
    if (!el) return;
    if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = num(to); return; }
    const t0 = performance.now();
    const step = t => {
        const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
        el.textContent = num(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

async function refreshMe() {
    const d = await api('/api/me');
    const prev = ME ? ME.balance : null;
    ME = d.user; CFG = d.config; COUNTS = d.project_counts || {};
    const chip = document.getElementById('balChip');
    chip.style.display = 'flex';
    countUp(document.getElementById('balVal'), prev ?? ME.balance, ME.balance);
    if (prev !== null && prev !== ME.balance) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
    return ME;
}

function shareLink(kind, id, text) {
    if (!CFG.bot_username) return toast('Посилання стане доступним після перезапуску бота', true);
    const link = `https://t.me/${CFG.bot_username}?start=${kind}_${id}`;
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
}

// ================================================================ навігація
function setTab(tab) {
    haptic();
    if (state.tab === tab && state.stack.length === 1 && tab !== 'sell') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    state.tab = tab;
    state.stack = [{ name: ROOTS[tab], params: {} }];
    render('fade');
}
function go(name, params = {}) { haptic(); state.stack.push({ name, params }); render('fwd'); }
function back() {
    if (document.getElementById('sheet').classList.contains('on')) return closeSheet();
    if (state.stack.length > 1) { haptic(); state.stack.pop(); render('back'); }
}
function setTitle(html) { document.getElementById('title').innerHTML = html; }

async function render(dir = 'fade') {
    stopPolling();
    const seq = ++renderSeq;
    const cur = state.stack[state.stack.length - 1];
    const deep = state.stack.length > 1;
    document.getElementById('backBtn').classList.toggle('show', deep && !(tg && tg.initData));
    try { deep ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
    document.getElementById('tabbar').style.setProperty('--t', TABS.indexOf(state.tab));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    document.body.classList.remove('has-buybar');
    const loader = setTimeout(() => { if (seq === renderSeq) $main.innerHTML = `<div class="page enter-fade">${skeletonPage()}</div>`; }, 120);
    try {
        const view = await VIEWS[cur.name](cur.params);
        clearTimeout(loader);
        if (seq !== renderSeq) return;
        $main.innerHTML = `<div class="page enter-${dir}">${view.html}</div>`;
        window.scrollTo(0, 0);
        if (view.after) view.after();
    } catch (e) {
        clearTimeout(loader);
        if (seq !== renderSeq) return;
        $main.innerHTML = `<div class="page enter-fade"><div class="empty">${ic('alert')}<p>${esc(e.message)}</p><button class="btn btn--ghost btn--s" onclick="render()">Спробувати ще раз</button></div></div>`;
    }
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function skeletonPage() {
    return `<div class="sk" style="height:44px;margin-bottom:14px"></div>${skeletonGrid(4)}`;
}
function skeletonGrid(n) {
    return `<div class="grid">${Array.from({ length: n }, () => `<div><div class="sk" style="aspect-ratio:4/3;border-radius:16px 16px 4px 4px"></div><div class="sk" style="height:14px;margin:10px 8px 6px"></div><div class="sk" style="height:14px;width:60%;margin:0 8px 8px"></div><div class="sk" style="height:26px;width:46%;margin:0 8px"></div></div>`).join('')}</div>`;
}

window.addEventListener('scroll', () => document.getElementById('topbar').classList.toggle('scrolled', scrollY > 4), { passive: true });

// ================================================================ шторка
function openSheet(html) {
    const s = document.getElementById('sheet');
    s.innerHTML = '<div class="grab"></div>' + html;
    s.scrollTop = 0;
    requestAnimationFrame(() => { s.classList.add('on'); document.getElementById('backdrop').classList.add('on'); });
    try { tg.BackButton.show(); } catch (e) {}
    haptic('medium');
}
function closeSheet() {
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('backdrop').classList.remove('on');
    try { if (state.stack.length <= 1) tg.BackButton.hide(); } catch (e) {}
}
const sheetCancel = (t = 'Скасувати') => `<button class="btn btn--ghost cancel" onclick="closeSheet()">${t}</button>`;

// ================================================================ VIEWS
const VIEWS = {};

// ---------- Головна: вибір проєкту
VIEWS.home = async () => {
    setTitle(`<span class="logo"><span class="plate"><i>UA</i><b>RP</b></span>Market</span>`);
    const draw = !homeAnimated; homeAnimated = true;
    const tiles = CFG.projects.map((p, i) => {
        const n = COUNTS[p.id] || 0;
        return `<button class="proj" style="--i:${i + 2}" data-p="${esc(p.id)}">
            <div class="proj-logo"><img src="${esc(p.img)}" alt="" class="fade" onload="this.classList.add('ok')" onerror="this.outerHTML='<span class=&quot;fallback&quot;>${esc(p.id.split(' ').map(w => w[0]).join(''))}</span>'"></div>
            <b>${esc(p.id)}</b><span>${n ? `${n} ${plural(n, W.listing)}` : 'Поки без оголошень'}</span></button>`;
    }).join('');
    return {
        html: `
            <div class="${draw ? 'stagger' : ''}">
                <section class="safe" style="--i:0">
                    <svg class="shield ${draw ? 'draw' : ''}" viewBox="0 0 64 64" aria-hidden="true">
                        <path class="s-fill" d="M32 7 52 15v14c0 12.5-8.6 22.6-20 25.8C20.6 51.6 12 41.5 12 29V15z"/>
                        <path class="s-body" pathLength="1" d="M32 7 52 15v14c0 12.5-8.6 22.6-20 25.8C20.6 51.6 12 41.5 12 29V15z"/>
                        <path class="s-check" pathLength="1" d="m23.5 31.5 6 6 11-12"/>
                    </svg>
                    <div><h2>Кожна покупка — безпечна угода</h2>
                    <p>Продавець отримає гроші тільки після того, як ти підтвердиш, що товар у тебе.</p>
                    <button class="link" onclick="showRules()">Як це працює${ic('next', 'i--s')}</button></div>
                </section>
                <div class="sec-title" style="--i:1">Обери проєкт</div>
                <div class="projects ${draw ? 'stagger' : ''}">${tiles}</div>
            </div>`,
        after() {
            document.querySelectorAll('.proj').forEach(b => b.onclick = () => { state.project = b.dataset.p; go('listings', { project: b.dataset.p }); });
        },
    };
};

// ---------- Стрічка оголошень
function listingCard(l, i = 0) {
    const thumb = l.image ? imgTag(media(l.image), l.title) : phTag(l.category);
    const tags = (l.top ? `<span class="tag tag--top">${ic('pin')}ТОП</span>` : '') + (l.vip ? `<span class="tag tag--vip">${ic('crown')}VIP</span>` : '');
    const s = l.seller;
    return `<button class="lcard${l.vip ? ' vip' : ''}" style="--i:${i}" onclick="go('listing',{id:${l.id}})">
        <div class="thumb">${thumb}<div class="tags">${tags}</div></div>
        <div class="lbody"><h3>${esc(l.title)}</h3>
            ${s ? `<div class="seller-mini">${ava(s, 'xs')}<span>${esc(s.name)}</span>${s.rating ? `<span class="rate">${ic('star', 'i--fill i--s')}${s.rating.toFixed(1)}</span>` : ''}</div>` : ''}
            ${plate(l.price, (l.vip ? 'plate--vip ' : '') + 'plate--s')}
        </div></button>`;
}

const SORTS = { new: 'Спочатку нові', cheap: 'Спочатку дешевші', expensive: 'Спочатку дорожчі' };
VIEWS.listings = async ({ project }) => {
    setTitle(esc(project));
    feed = { project, category: '', q: '', sort: 'new', offset: 0 };
    const chips = [['', 'Усе', 'grid'], ...Object.entries(CFG.categories).map(([k, v]) => [k, v, CAT_ICON[k]])]
        .map(([k, v, i]) => `<button class="chip${k === '' ? ' on' : ''}" data-cat="${k}">${ic(i)}${esc(v)}</button>`).join('');
    return {
        html: `
            <div class="filterbar">
                <div class="search">${ic('search')}<input id="q" type="search" enterkeyhint="search" placeholder="Що шукаєш? Вірти, акаунт, дім…">
                <button class="icon-btn" id="sortBtn" aria-label="Сортування">${ic('sort')}</button></div>
                <div class="chips">${chips}</div>
            </div>
            <div class="grid" id="grid"></div>
            <div id="more"></div>`,
        after() {
            document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
                if (c.classList.contains('on')) return;
                haptic();
                document.querySelector('.chip.on').classList.remove('on');
                c.classList.add('on');
                c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                feed.category = c.dataset.cat; loadFeed(true);
            });
            let t;
            document.getElementById('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { feed.q = e.target.value; loadFeed(true); }, 350); };
            document.getElementById('sortBtn').onclick = openSort;
            loadFeed(true);
        },
    };
};

function openSort() {
    openSheet(`<h3>Сортування</h3>${Object.entries(SORTS).map(([k, v]) =>
        `<button class="sort-opt${feed.sort === k ? ' on' : ''}" data-s="${k}">${v}${ic('check')}</button>`).join('')}<div style="height:8px"></div>`);
    document.querySelectorAll('.sort-opt').forEach(b => b.onclick = () => {
        feed.sort = b.dataset.s; haptic(); closeSheet(); loadFeed(true);
    });
}

async function loadFeed(reset) {
    const grid = document.getElementById('grid'), more = document.getElementById('more');
    if (!grid) return;
    const seq = renderSeq;
    if (reset) { feed.offset = 0; grid.outerHTML = `<div id="grid">${skeletonGrid(4)}</div>`; more.innerHTML = ''; }
    const p = new URLSearchParams({ project: feed.project, category: feed.category, q: feed.q, sort: feed.sort, offset: feed.offset });
    try {
        const d = await api('/api/listings?' + p);
        if (seq !== renderSeq) return;
        const g = document.getElementById('grid');
        if (reset) { g.className = 'grid stagger'; g.innerHTML = ''; }
        g.insertAdjacentHTML('beforeend', d.items.map((l, i) => listingCard(l, i)).join(''));
        feed.offset += d.items.length;
        const m = document.getElementById('more');
        if (!feed.offset) {
            m.innerHTML = feed.q || feed.category
                ? `<div class="empty">${ic('search')}<p>Нічого не знайшли. Спробуй інший запит або категорію.</p></div>`
                : `<div class="empty">${ic('store')}<p>У ${esc(feed.project)} ще ніхто нічого не продає. Твоє оголошення буде першим.</p><button class="btn btn--main btn--s" onclick="setTab('sell')">${ic('plus')}Додати оголошення</button></div>`;
        } else {
            m.innerHTML = d.more ? `<div style="margin-top:16px"><button class="btn btn--ghost" id="moreBtn">Показати ще</button></div>` : '';
            const mb = document.getElementById('moreBtn');
            if (mb) mb.onclick = () => run(mb, () => loadFeed(false));
        }
    } catch (e) {
        const m = document.getElementById('more');
        if (m) m.innerHTML = `<div class="empty">${ic('alert')}<p>${esc(e.message)}</p></div>`;
        const g = document.getElementById('grid'); if (g && reset) g.innerHTML = '';
    }
}

// ---------- Сторінка оголошення
function reviewItem(r) {
    const author = { id: r.author_id, name: r.author, photo: r.author_photo };
    return `<div class="review">${ava(author, 's')}<div class="body">
        <div class="head"><b>${esc(r.author)}</b>${stars(r.rating)}</div>
        ${r.text ? `<p>${esc(r.text)}</p>` : ''}
        <div class="deal">${r.deal_title ? ic('box', 'i--s') + `<span>${esc(r.deal_title)}</span>` : ''}<span style="margin-left:auto">${when(r.created_at)}</span></div>
    </div></div>`;
}

VIEWS.listing = async ({ id }) => {
    const { listing: l, reviews } = await api('/api/listings/' + id);
    setTitle(esc(l.project));
    const s = l.seller;
    const tags = (l.top ? `<span class="tag tag--top">${ic('pin')}ТОП</span>` : '') + (l.vip ? `<span class="tag tag--vip">${ic('crown')}VIP</span>` : '');
    let actions = '';
    const canBuy = !l.is_mine && l.qty > 0 && l.status === 'active';
    if (l.is_mine) {
        actions = `<div class="actions" style="margin-top:16px">
            <button class="btn btn--main" onclick="openPromo(${l.id})">${ic('rocket')}Просунути оголошення</button>
            <div class="row-btns">

function compressImage(f, max = 1280, q = 0.84) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => {
            const im = new Image();
            im.onload = () => {
                const k = Math.min(1, max / Math.max(im.width, im.height));
                const c = document.createElement('canvas');
                c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
                c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', q));
            };
            im.onerror = () => reject(new Error('Не вдалося відкрити фото. Спробуй інше.'));
            im.src = r.result;
        };
        r.onerror = () => reject(new Error('Не вдалося відкрити фото. Спробуй інше.'));
        r.readAsDataURL(f);
    });
}

function openPromo(id, fresh) {
    const icons = { vip: 'crown', top: 'pin', bump: 'up' };
    const opts = Object.entries(CFG.promos).map(([k, p]) => `
        <div class="opt"><span class="sico ${k === 'vip' ? 'c-yellow' : k === 'top' ? 'c-blue' : 'c-green'}">${ic(icons[k])}</span>
            <div class="grow"><h4>${esc(p.title)}</h4><p>${esc(p.desc)}</p></div>
            <div class="pays">
                <button class="pay pay--uah" onclick="buyPromo(this,${id},'${k}','balance')">${num(p.uah)} ₴</button>
                <button class="pay pay--star" onclick="buyPromo(this,${id},'${k}','stars')">${ic('star', 'i--fill')}${p.stars}</button>

    openSheet(`<h3>${fresh ? 'Оголошення опубліковано' : 'Просування'}</h3>

function buyPromo(btn, id, type, pay) {
    run(btn, async () => {
        const p = CFG.promos[type];
        if (pay === 'balance') {
            if (ME.balance < p.uah) { closeSheet(); return setTimeout(() => openTopup(Math.max(p.uah - ME.balance, CFG.min_topup)), 300); }
            if (!(await confirmBox(`${p.title} за ${uah(p.uah)}? Сума спишеться з балансу.`))) return;
            await api('/api/promote', { listing_id: id, type, pay });
            closeSheet(); await refreshMe(); toast(`${p.title}: увімкнено`); render('fade');
        } else {
            const d = await api('/api/promote', { listing_id: id, type, pay });
            tg.openInvoice(d.invoice_link, status => {
                if (status === 'paid') { closeSheet(); toast(`${p.title}: увімкнено`); setTimeout(() => render('fade'), 1200); }
                else if (status === 'failed') toast('Оплата зірками не пройшла', true);
            });
        }
    });
}

            <button class="btn btn--main" id="rBtn" style="margin-top:10px">Залишити відгук</button></div>`;
    } else if (D.review) {
        review = `<div class="panel" style="margin-top:12px"><div class="small muted" style="margin-bottom:6px">Твій відгук</div>${stars(D.review.rating)}${D.review.text ? `<p style="margin-top:6px">${esc(D.review.text)}</p>` : ''}</div>`;
    }

    const myId = ME.id;
    const msgHtml = m => {
        if (m.sender_id === 0) return `<div class="msg sys">${esc(m.text)}</div>`;
        if (m.sender_id === myId) return `<div class="msg me">${esc(m.text)}<time>${hm(m.created_at)}</time></div>`;
        if (m.sender_id !== d.buyer_id && m.sender_id !== d.seller_id) return `<div class="msg adm"><strong>Адміністрація</strong>${esc(m.text)}<time>${hm(m.created_at)}</time></div>`;
        return `<div class="msg them">${esc(m.text)}<time>${hm(m.created_at)}</time></div>`;
    };
    let lastId = D.messages.length ? D.messages[D.messages.length - 1].id : 0;

    return {
        html: `
            <div class="panel">
                <div class="deal-top"><h1>${esc(d.title)}</h1><span class="status ${S.c}">${ic(S.i)}${S.t}</span></div>
                <div class="money">
                    <div><span class="muted">Сума</span>${plate(d.amount, 'plate--s')}</div>
                    ${role !== 'buyer' ? `<div><span class="muted">Комісія маркету</span><span>−${uah(d.fee)}</span></div>
                    <div><span class="muted">Продавець отримає</span><b style="color:var(--green)">${uah(d.payout)}</b></div>` : ''}
                    <div><span class="muted">${role === 'buyer' ? 'Продавець' : role === 'seller' ? 'Покупець' : 'Учасники'}</span>
                    ${role === 'admin' ? `<span>${esc(D.buyer.name)} і ${esc(D.seller.name)}</span>` : `<button class="link" onclick="go('user',{id:${other.id}})">${esc(other.name)}</button>`}</div>
                </div>
                <div class="track-steps"><div class="line"><i id="trackFill"></i></div>${steps}</div>
            </div>
            ${hint ? `<div class="hint ${hintCls}">${ic(st === 'dispute' ? 'scale' : st === 'completed' ? 'check' : 'info')}<span>${hint}</span></div>` : ''}
            ${actions ? `<div class="actions">${actions}</div>` : ''}
            ${review}
            <div class="sec-title">Чат угоди</div>
            <div class="panel">
                <div class="chat" id="chat">${D.messages.map(msgHtml).join('')}</div>
                <div class="composer"><input id="chatIn" maxlength="1000" placeholder="Напиши повідомлення" enterkeyhint="send"><button class="send" id="chatBtn" aria-label="Надіслати">${ic('send')}</button></div>
                <p class="note">Пиши тільки тут. Якщо виникне спір, адміністратор вирішуватиме за цим чатом.</p>
            </div>`,
        after() {
            requestAnimationFrame(() => { const f = document.getElementById('trackFill'); if (f) f.style.width = pct + '%'; });
            const chat = document.getElementById('chat');
            chat.scrollTop = chat.scrollHeight;
            const input = document.getElementById('chatIn'), btn = document.getElementById('chatBtn');
            const seq = renderSeq;
            const pull = async () => {
                const r = await api(`/api/deals/${d.id}?after=${lastId}`);
                if (seq !== renderSeq) return;
                if (r.messages.length) {
                    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
                    chat.insertAdjacentHTML('beforeend', r.messages.map(msgHtml).join(''));
                    lastId = r.messages[r.messages.length - 1].id;
                    if (atBottom) chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
                    if (r.messages.some(m => m.sender_id !== myId)) haptic('soft');
                }
                if (r.status !== st && !input.value) { await refreshMe(); render('fade'); }
            };
            const send = async () => {
                const text = input.value.trim();
                if (!text || btn.disabled) return;
                btn.disabled = true;
                try { await api(`/api/deals/${d.id}/message`, { text }); input.value = ''; await pull(); }
                catch (e) { toast(e.message, true); }
                finally { btn.disabled = false; }
            };
            btn.onclick = send;
            input.onkeydown = e => { if (e.key === 'Enter') send(); };
            pollTimer = setInterval(() => pull().catch(() => {}), 4000);

            const pick = document.getElementById('rPick');
            if (pick) {
                let rating = 5;
                const paint = () => pick.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v <= rating));
                pick.querySelectorAll('button').forEach(b => b.onclick = () => { rating = +b.dataset.v; paint(); haptic(); });
                paint();
                const rb = document.getElementById('rBtn');
                rb.onclick = () => run(rb, async () => {
                    await api(`/api/deals/${d.id}/action`, { action: 'review', rating, text: document.getElementById('rText').value });
                    toast('Відгук опубліковано'); render('fade');
                });
            }
        },
    };
};

    return `<section class="pf">
        <div class="pf-road"></div>
        <div class="pf-main">
            ${ava(u, 'xl')}
            <div class="pf-actions">
                ${isMe ? `<button class="icon-btn" onclick="openBio()" aria-label="Змінити опис">${ic('edit')}</button>` : ''}
                <button class="icon-btn" id="pfShare" aria-label="Поділитися профілем">${ic('share')}</button>
            </div>
            <h1>${esc(u.name)}</h1>
            <div class="pf-since">На маркеті з ${since}</div>
            ${trust(u)}
            <p class="pf-bio ${u.bio ? '' : 'empty-bio'}" id="pfBio">${u.bio ? esc(u.bio) : (isMe ? 'Розкажи покупцям про себе: на якому сервері граєш, як швидко передаєш товар.' : '')}</p>
            <div class="stats">
                <div><b>${u.rating ? ic('star', 'i--fill') + u.rating.toFixed(1) : '—'}</b><span>рейтинг</span></div>
                <div><b>${u.deals}</b><span>${plural(u.deals, W.deal)}</span></div>
                <div><b>${u.reviews}</b><span>${plural(u.reviews, W.review)}</span></div>
            </div>
        </div></section>`;
}

function ratingSummary(u, dist) {
    const total = Object.values(dist).reduce((a, b) => a + b, 0) || 1;
    return `<div class="panel rsum">
        <div class="avg"><b>${u.rating ? u.rating.toFixed(1) : '—'}</b>${stars(u.rating || 0)}<div class="small muted" style="margin-top:4px">${u.reviews} ${plural(u.reviews, W.review)}</div></div>
        <div class="bars">${[5, 4, 3, 2, 1].map(r => `<div class="bar"><span>${r}</span><div class="track"><div class="fill" data-w="${(dist[r] / total) * 100}"></div></div><span>${dist[r]}</span></div>`).join('')}</div>
    </div>`;
}
function animateBars() { requestAnimationFrame(() => document.querySelectorAll('.bar .fill').forEach(f => f.style.width = f.dataset.w + '%')); }

function setupTabs(segId, onShow) {
    const seg = document.getElementById(segId);
    seg.querySelectorAll('button').forEach((b, i) => b.onclick = () => {
        if (b.classList.contains('on')) return;
        haptic(); seg.style.setProperty('--v', i);
        seg.querySelector('.on').classList.remove('on'); b.classList.add('on');
        document.querySelectorAll(`[data-panel="${segId}"]`).forEach((p, j) => {
            p.hidden = j !== i;
            if (j === i) { p.classList.remove('page', 'enter-fade'); void p.offsetWidth; p.classList.add('page', 'enter-fade'); }
        });
        onShow && onShow(i);
    });
}

function watchBalance() {
    const start = ME.balance; let n = 0;
    const t = setInterval(async () => {
        if (++n > 36) return clearInterval(t);
        try {
            await refreshMe();
            if (ME.balance > start) {
                clearInterval(t); toast('Баланс поповнено на ' + uah(ME.balance - start));
                if (state.stack[state.stack.length - 1].name === 'me') render('fade');
            }
        } catch (e) {}
    }, 5000);
}

        <div class="hint">${ic('clock')}<span>Якщо покупець мовчить ${CFG.confirm_hours} год після передачі, угода закривається на користь продавця.</span></div>
        <div class="hint hint--red">${ic('alert')}<span>Не плати напряму й не переходь в особисті. Поза маркетом ми не зможемо повернути гроші.</span></div>
        <p class="note">Для покупця угода безкоштовна. Продавець платить ${CFG.commission_percent}% комісії з продажу.</p>
        ${sheetCancel('Зрозуміло')}`);
}

// ================================================================ старт
async function boot() {
    if (!tg || !tg.initData) {
        document.getElementById('tabbar').style.display = 'none';
        $main.innerHTML = `<div class="gate">${ic('tg', 'i--l')}<p>Відкрий RP Market через Telegram-бота. Так маркет знає, що це саме ти, і захищає твої угоди.</p></div>`;
        return;
    }
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#121722'); tg.setBackgroundColor('#121722'); } catch (e) {}
    try { tg.setBottomBarColor('#121722'); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    tg.BackButton.onClick(back);
    $main.innerHTML = skeletonPage();
    try { await refreshMe(); }
    catch (e) {
        $main.innerHTML = `<div class="empty">${ic('alert')}<p>${esc(e.message)}</p><button class="btn btn--ghost btn--s" onclick="location.reload()">Спробувати ще раз</button></div>`;
        return;
    }
    const qs = new URLSearchParams(location.search);
    const sp = tg.initDataUnsafe.start_param || '';
    const pick = (k, pre) => { const v = qs.get(k) || (sp.startsWith(pre) ? sp.slice(pre.length) : null); return v && /^\d+$/.test(v) ? +v : null; };
    const dealId = pick('deal', 'deal_'), listingId = pick('listing', 'l_'), userId = pick('user', 'u_');
    if (dealId) { state.tab = 'deals'; state.stack = [{ name: 'deals', params: {} }, { name: 'deal', params: { id: dealId } }]; }
    else if (listingId) { state.tab = 'market'; state.stack = [{ name: 'home', params: {} }, { name: 'listing', params: { id: listingId } }]; }
    else if (userId) { state.tab = 'market'; state.stack = [{ name: 'home', params: {} }, { name: 'user', params: { id: userId } }]; }
    else { state.tab = 'market'; state.stack = [{ name: 'home', params: {} }]; }
    render('fade');
}
boot();
</script>
